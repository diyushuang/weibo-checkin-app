name: release-apk

# 发版流水线：推 v* tag 时构建「已签名的 release APK」，并直接挂到 GitHub Release 上 ——
# 发布页点一下就能下载安装，不用登录翻 Actions 产物（产物 90 天过期，还要解压）。
# 日常 push 的构建闸门是 build-apk.yml（单测 + debug APK）。
#
# 正常发版：
#   改三处版本号 → 提交推主干 → git tag v0.9.15 && git push origin v0.9.15
# 只想验证流水线（不发 Release）：Actions 页面手动 Run workflow，只构建并上传产物。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: '构建后发布 GitHub Release（不勾选则只构建并上传产物）'
        type: boolean
        default: false

# 创建 Release 与上传附件需要写权限
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: 解析版本号并校验三处同步
        run: |
          set -euo pipefail
          NAME=$(sed -n 's/^ *versionName *= *"\(.*\)"/\1/p' app/build.gradle.kts | head -1)
          CODE=$(sed -n 's/^ *versionCode *= *\([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -1)
          TAG="${GITHUB_REF_NAME}"
          TYPE="${GITHUB_REF_TYPE:-branch}"
          echo "ref=${TAG} (${TYPE}) versionName=${NAME} versionCode=${CODE}"

          if [ -z "${NAME}" ] || [ -z "${CODE}" ]; then
            echo "::error::没能从 app/build.gradle.kts 解析出 versionName / versionCode。"
            exit 1
          fi

          VERSION="${NAME}"
          if [ "${TYPE}" = "tag" ]; then
            VERSION="${TAG#v}"
            if [ "${NAME}" != "${VERSION}" ]; then
              echo "::error::tag ${TAG} 与 versionName ${NAME} 不一致。发版要求三处同步（versionName / CHANGELOG 小节 / README 标注），请先把版本号改好再打 tag。"
              exit 1
            fi
          else
            echo "手动触发：以 versionName ${VERSION} 作为版本号。"
          fi

          if ! grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md 缺少 ## [${VERSION}] 小节 —— 发布说明没有来源。"
            exit 1
          fi

          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: 从 CHANGELOG 生成本版发布说明
        run: |
          set -euo pipefail
          # 取 ## [x.y.z] 到下一个 ## [ 之间的正文，去掉分隔线
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { out = 1 }
            out && index($0, "## [") == 1 && index($0, "## [" ver "]") != 1 { exit }
            out && $0 == "---" { next }
            out {
              if ($0 ~ /[^[:space:]]/ || started) {
                started = 1; n++; line[n] = $0
                if ($0 ~ /[^[:space:]]/) last = n
              }
            }
            END { for (i = 1; i <= last; i++) print line[i] }
          ' CHANGELOG.md > "${RUNNER_TEMP}/release-notes.raw"

          # 标题沿用「v0.9.13 — 一句话说清这版干了什么」的既有写法：
          # 取本版第一个 ### 小节标题，去掉「修复：/改进：/工程：」这类分类前缀。
          # 注意用 (:|：) 交替而不是 [：:]，C locale 下字符类会把多字节汉字切坏。
          TITLE=$(awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { out = 1; next }
            out && index($0, "## [") == 1 { exit }
            out && index($0, "### ") == 1 {
              sub(/^### */, "")
              sub(/^(修复|改进|工程)(:|：) */, "")
              print; exit
            }
          ' CHANGELOG.md)

          if [ ! -s "${RUNNER_TEMP}/release-notes.raw" ]; then
            echo "::error::CHANGELOG.md 的 ## [$VERSION] 小节是空的。"
            exit 1
          fi

          {
            printf '> 下载下面的 `wcm-checkin-%s-release.apk` 安装即可；已装旧版可直接覆盖（同一套固定签名）。\n\n' "$VERSION"
            cat "${RUNNER_TEMP}/release-notes.raw"
          } > "${RUNNER_TEMP}/release-notes.md"

          if [ -n "${TITLE}" ]; then
            echo "RELEASE_TITLE=v${VERSION} — ${TITLE}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TITLE=v${VERSION}" >> "$GITHUB_ENV"
          fi
          echo "VERSION=${VERSION} TITLE=${TITLE}"

      - name: Decode signing keystore
        env:
          WCM_KEYSTORE_B64: ${{ secrets.WCM_KEYSTORE_B64 }}
          WCM_KEYSTORE_PASSWORD: ${{ secrets.WCM_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          # 发版必须有固定签名：没有它只能产出 app-release-unsigned.apk，
          # 既装不上、也无法覆盖升级，发出去就是坏包，所以这里直接失败。
          if [ -z "${WCM_KEYSTORE_B64:-}" ]; then
            echo "::error::缺少 Secret WCM_KEYSTORE_B64。发版必须用固定签名（配置方法见 README「APK 签名」）。"
            exit 1
          fi
          if [ -z "${WCM_KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::缺少 Secret WCM_KEYSTORE_PASSWORD（keystore 口令）。"
            exit 1
          fi
          mkdir -p app/keystore
          printf '%s' "${WCM_KEYSTORE_B64}" | base64 -d > app/keystore/wcm-release.p12
          test -s app/keystore/wcm-release.p12 || {
            echo "::error::keystore 解码后为空，检查 WCM_KEYSTORE_B64 是否为完整的 base64。"
            exit 1
          }

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # 与 build-apk.yml 同一条守门规则：:domain 不得依赖 :data
      - name: Architecture gate
        run: |
          if grep -q 'project(":data")' domain/build.gradle.kts; then
            echo '::error file=domain/build.gradle.kts::domain 依赖了 data：依赖倒置被破坏'
            exit 1
          fi

      - name: Unit tests & Build signed release APK
        env:
          WCM_KEYSTORE_PASSWORD: ${{ secrets.WCM_KEYSTORE_PASSWORD }}
        run: |
          set +e
          sh gradlew testDebugUnitTest assembleRelease --no-daemon > build.log 2>&1
          CODE=$?
          set -e
          if [ $CODE -ne 0 ]; then
            # 单测失败：把 JUnit 报告的断言消息（含期望/实际值）转成注解
            if ls app/build/test-results/testDebugUnitTest/*.xml >/dev/null 2>&1; then
              grep -h -A 8 "<failure" app/build/test-results/testDebugUnitTest/*.xml \
                | head -80 | grep -vE '^\s*$' | while IFS= read -r line; do
                  printf '::error::TEST %s\n' "$(echo "$line" | sed 's/"/%22/g' | cut -c1-280)"
                done
            fi
            # 编译错误转成注解：不需要登录、拉日志也能看到明细
            grep -E "^e: |error: |FAILED|FAILURE|What went wrong|Caused by" -A 2 build.log \
              | grep -vE '^\s*$' | head -50 | sed 's/^/ /' | while IFS= read -r line; do
                printf '::error::%s\n' "$(echo "$line" | sed 's/"/%22/g')"
              done
            tail -40 build.log | while IFS= read -r line; do
              printf '::error::TAIL %s\n' "$(echo "$line" | sed 's/"/%22/g')"
            done
            exit $CODE
          fi

      - name: 收集并校验 APK 签名
        run: |
          set -euo pipefail
          SRC=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$SRC" ]; then
            echo "::error::没有生成 $SRC —— 若只有 app-release-unsigned.apk，说明签名配置没生效（检查两个 Secret 与 app/build.gradle.kts 的 signingConfigs.wcm）。"
            ls -R app/build/outputs/apk || true
            exit 1
          fi
          APK="wcm-checkin-${VERSION}-release.apk"
          cp "$SRC" "$APK"
          ls -lh "$APK"

          # 把证书指纹打到日志里：与历史版本同一套签名才允许覆盖安装
          BT=$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/* 2>/dev/null | sort -V | tail -1)
          if [ -n "${BT}" ] && [ -x "${BT}/apksigner" ]; then
            "${BT}/apksigner" verify --print-certs "$APK" | head -6
          else
            echo "::warning::找不到 apksigner，跳过签名校验。"
          fi

          echo "APK=${APK}" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: wcm-app-release
          path: ${{ env.APK }}
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_INPUT: ${{ inputs.publish }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [ "${REF_TYPE}" != "tag" ] && [ "${PUBLISH_INPUT}" != "true" ]; then
            echo "手动触发且未勾选 publish：只产出产物，不发 Release。"
            exit 0
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME 已存在：覆盖附件与说明。"
            gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
            gh release edit "$GITHUB_REF_NAME" --title "$RELEASE_TITLE" --notes-file "${RUNNER_TEMP}/release-notes.md"
          else
            gh release create "$GITHUB_REF_NAME" "$APK" \
              --title "$RELEASE_TITLE" \
              --notes-file "${RUNNER_TEMP}/release-notes.md"
          fi
          echo "发布完成：https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"
